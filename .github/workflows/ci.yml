name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read the code and nothing else. No job here writes to the repository,
# comments, or publishes, so the token is given nothing it could be used for
# if a step -- or an action, or a package a step installs -- were not what it
# claims to be. Actions are pinned to a commit for the same reason, since a
# tag can be moved; the comment beside each is the release it was, and
# .github/dependabot.yml proposes the next one.
permissions:
  contents: read

jobs:
  # Each job carries a limit, because the default is six hours and a
  # watcher test that hangs waits for an event that is not coming. Measured
  # on green runs: 25 to 45 seconds for each Linux job and just under three
  # minutes for macOS, so the limits are generous and only a hang meets them.
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The suite asserts geometry, so it needs no renderer and no system
      # libraries: an imposition is right or wrong by where the trims land.
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose

  # The oldest pikepdf pyproject.toml allows, on the oldest Python. A floor
  # nobody runs drifts: `pikepdf>=9` was written down and never run, and at
  # 9.0.0 19 tests failed, among them --damaged recover recovering nothing.
  # The rest of CI installs the newest release, so this is the only job that
  # would notice the code coming to need something newer than it says.
  floor:
    name: pikepdf floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pikepdf==10.0.0"
          python -m pip install -e .
          python -c "import pikepdf; assert pikepdf.__version__ == '10.0.0', pikepdf.__version__"
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pylint impose tests
      - run: python -m mypy
      - run: python -m black --check --diff .
      - run: python -m isort --check --diff .

  # Everything a shop copies into production: the two watcher scripts, the
  # systemd unit that runs one of them, and the folder they work on. None of
  # it can be tested on the macOS laptop this was written on -- the unit has
  # no systemd to read it, and the watcher runs there only against a polling
  # stand-in. This is the job where the real pair is measured.
  folder:
    name: watched folder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y bats inotify-tools

      # The runner image ships ShellCheck, and it is unpinned here for the
      # same reason the Python tools are: a watcher that only passes the
      # linter it was written against is not a watcher anybody should copy.
      - run: shellcheck impose/hotfolder/*.sh tests/shell/*.sh

      # The folder half ships as package data, and this is where that claim is
      # kept: a wheel, built here and installed into a virtual environment
      # with no checkout behind it, is where the watcher and the unit come
      # from for the rest of this job. --no-deps because impose-hotfolder
      # hands over files and needs no pikepdf to do it.
      #
      # It also puts the watcher at the path the unit names, which is the
      # install line the unit's own header gives -- and verify needs it
      # there, because it checks that ExecStart= is something executable.
      - name: Install from a wheel, the way a shop would
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/shop"
          "$RUNNER_TEMP/shop/bin/pip" install -q --no-deps "$RUNNER_TEMP"/dist/*.whl
          shop="$RUNNER_TEMP/shop/bin/impose-hotfolder"
          "$shop"
          watcher=$("$shop" --path watch-inotify.sh)
          unit=$("$shop" --path 'impose-folder@.service')
          # A path outside that environment would mean the command found the
          # checkout rather than the wheel, and the whole step proved nothing.
          for path in "$watcher" "$unit"; do
            case $path in
            "$RUNNER_TEMP/shop"/*) ;;
            *)
                printf '%s is not from the wheel\n' "$path" >&2
                exit 1
                ;;
            esac
          done
          sudo install -D -m 755 "$watcher" /usr/local/libexec/impose-watch
          printf 'UNIT=%s\n' "$unit" >> "$GITHUB_ENV"

      # Silence is the test, not the exit status. A misspelled directive --
      # `Restat=on-failure` -- is reported as `Unknown key` and then exits 0,
      # because ignoring what it does not understand is what systemd itself
      # does at load time, and that is the mistake this job exists to catch.
      # Measured on systemd 255 and 261; an unreadable value and an unknown
      # section behave the same way.
      #
      # Silence about this unit, that is. Verify reads the host's units as
      # well, and this runner ships three that warn about a `CPUAccounting=`
      # of their own -- which failed the job the first time it ran, on a file
      # nobody here wrote. So dependencies are left out of the verdict, and
      # what is read is the lines naming this unit: by file in a warning, by
      # instance in a refusal.
      #
      # The unit read here is the one in the wheel, not the one in the tree:
      # package data that stopped shipping would fail this step rather than
      # pass it quietly.
      - name: Verify the unit
        run: |
          report=$(systemd-analyze verify --recursive-errors=no \
              "$UNIT" 2>&1 |
              grep -F impose-folder) || true
          if [ -n "$report" ]; then
            printf '%s\n' "$report" >&2
            exit 1
          fi

      # The smoke test: a watcher started on a temporary folder, a PDF handed
      # to it while it runs, and the folder read back. On this job the event
      # source is the real /usr/bin/inotifywait.
      - run: bats --timing tests/shell

  # The other watcher, on the only kind of machine that can run it. Until
  # this job, the loop at the bottom of watch-fswatch.sh had never read an
  # event anywhere: it was written on a Mac with no fswatch, the Linux job
  # above has no FSEvents, and the Python suite stubs the event source out.
  folder-macos:
    name: watched folder (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          brew install bats-core fswatch coreutils

      # What fswatch says about the two ways a file arrives, written into
      # the log rather than assumed: the script asks for three event names,
      # and whether a rename into the folder is one of them is a fact about
      # FSEvents that nobody here had measured.
      #
      # Then what the watcher does to a file it takes -- a hard link out to
      # work/ and a remove -- because the script now rescans the inbox when
      # FSEvents names the inbox itself, and it should not do that here.
      - name: What an arrival looks like to fswatch
        run: |
          mkdir "$RUNNER_TEMP/seen" "$RUNNER_TEMP/work"
          fswatch -x "$RUNNER_TEMP/seen" > "$RUNNER_TEMP/events" &
          sleep 3
          printf 'copied\n' > "$RUNNER_TEMP/seen/copied.pdf"
          printf 'renamed\n' > "$RUNNER_TEMP/staged"
          mv "$RUNNER_TEMP/staged" "$RUNNER_TEMP/seen/renamed.pdf"
          sleep 2
          ln "$RUNNER_TEMP/seen/copied.pdf" "$RUNNER_TEMP/work/copied.pdf"
          rm "$RUNNER_TEMP/seen/copied.pdf"
          sleep 4
          kill %1
          cat "$RUNNER_TEMP/events"

      # Both scripts' startup and sweep on a real BSD userland, with
      # gtimeout there for the two tests that want it.
      - run: python -m unittest tests.test_watched_folder --verbose

      - run: IMPOSE_WATCHER=fswatch bats --timing tests/shell
