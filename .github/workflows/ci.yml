name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The suite asserts geometry, so it needs no renderer and no system
      # libraries: an imposition is right or wrong by where the trims land.
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pylint impose tests
      - run: python -m black --check --diff .
      - run: python -m isort --check --diff .

  # Everything a shop copies into production: the two watcher scripts, the
  # systemd unit that runs one of them, and the folder they work on. None of
  # it can be tested on the macOS laptop this was written on -- the unit has
  # no systemd to read it, and the watcher runs there only against a polling
  # stand-in. This is the job where the real pair is measured.
  folder:
    name: watched folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y bats inotify-tools

      # The runner image ships ShellCheck, and it is unpinned here for the
      # same reason the Python tools are: a watcher that only passes the
      # linter it was written against is not a watcher anybody should copy.
      - run: shellcheck impose/hotfolder/*.sh tests/shell/*.sh

      # The folder half ships as package data, and this is where that claim is
      # kept: a wheel, built here and installed into a virtual environment
      # with no checkout behind it, is where the watcher and the unit come
      # from for the rest of this job. --no-deps because impose-hotfolder
      # hands over files and needs no pikepdf to do it.
      #
      # It also puts the watcher at the path the unit names, which is the
      # install line the unit's own header gives -- and verify needs it
      # there, because it checks that ExecStart= is something executable.
      - name: Install from a wheel, the way a shop would
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/shop"
          "$RUNNER_TEMP/shop/bin/pip" install -q --no-deps "$RUNNER_TEMP"/dist/*.whl
          shop="$RUNNER_TEMP/shop/bin/impose-hotfolder"
          "$shop"
          watcher=$("$shop" --path watch-inotify.sh)
          unit=$("$shop" --path 'impose-folder@.service')
          # A path outside that environment would mean the command found the
          # checkout rather than the wheel, and the whole step proved nothing.
          for path in "$watcher" "$unit"; do
            case $path in
            "$RUNNER_TEMP/shop"/*) ;;
            *)
                printf '%s is not from the wheel\n' "$path" >&2
                exit 1
                ;;
            esac
          done
          sudo install -D -m 755 "$watcher" /usr/local/libexec/impose-watch
          printf 'UNIT=%s\n' "$unit" >> "$GITHUB_ENV"

      # Silence is the test, not the exit status. A misspelled directive --
      # `Restat=on-failure` -- is reported as `Unknown key` and then exits 0,
      # because ignoring what it does not understand is what systemd itself
      # does at load time, and that is the mistake this job exists to catch.
      # Measured on systemd 255 and 261; an unreadable value and an unknown
      # section behave the same way.
      #
      # Silence about this unit, that is. Verify reads the host's units as
      # well, and this runner ships three that warn about a `CPUAccounting=`
      # of their own -- which failed the job the first time it ran, on a file
      # nobody here wrote. So dependencies are left out of the verdict, and
      # what is read is the lines naming this unit: by file in a warning, by
      # instance in a refusal.
      #
      # The unit read here is the one in the wheel, not the one in the tree:
      # package data that stopped shipping would fail this step rather than
      # pass it quietly.
      - name: Verify the unit
        run: |
          report=$(systemd-analyze verify --recursive-errors=no \
              "$UNIT" 2>&1 |
              grep -F impose-folder) || true
          if [ -n "$report" ]; then
            printf '%s\n' "$report" >&2
            exit 1
          fi

      # The smoke test: a watcher started on a temporary folder, a PDF handed
      # to it while it runs, and the folder read back. On this job the event
      # source is the real /usr/bin/inotifywait.
      - run: bats --timing tests/shell
