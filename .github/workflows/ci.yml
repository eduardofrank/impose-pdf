name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The suite asserts geometry, so it needs no renderer and no system
      # libraries: an imposition is right or wrong by where the trims land.
      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pylint impose tests
      - run: python -m black --check --diff .
      - run: python -m isort --check --diff .

      # The runner image ships ShellCheck, and it is unpinned here for the
      # same reason the Python tools are: a watcher that only passes the
      # linter it was written against is not a watcher anybody should copy.
      - run: shellcheck tools/*.sh tests/shell/*.sh

  # The one job that runs a watcher against real inotify. The tests work on a
  # macOS laptop too, through the stand-in in tests/shell, but a stand-in is
  # a stand-in: what a shop puts under systemd is this script on top of
  # inotify-tools, and this is where that pair is measured.
  shell:
    name: shell (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y bats inotify-tools
      - run: bats --timing tests/shell
